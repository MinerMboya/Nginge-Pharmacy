name: Nginge Pharmacy checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24\n          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Run syntax and workflow tests
        run: npm test
